[project]
name = "oldman-agent"
version = "0.2.1a0"
description = "꼰대 정보통 — A2A 에이전트 생태계의 메타-기록자 (A2A v0.3 compliant)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "duckdb>=1.1.0",
    "pydantic>=2.5",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "a2a-sdk>=1.0,<2.0",
    "python-dotenv>=1.0",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
norecursedirs = ["eval", "spikes"]
markers = [
    "integration: requires DB / network",
]
